<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }
    .eye { 
      animation: pulse 3s ease-in-out infinite; 
      transform-origin: 57.5px 32.5px;
    }
  </style>
  <defs>
    <linearGradient id="bot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8477F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A399F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="30" y="30" width="40" height="40" rx="14" fill="url(#bot-grad)" />
  <rect x="45" y="20" width="25" height="25" rx="10" fill="white" opacity="0.9" />
  <rect x="45" y="20" width="25" height="25" rx="10" fill="url(#bot-grad)" opacity="0.3" />
  <circle class="eye" cx="57.5" cy="32.5" r="4" fill="url(#bot-grad)" />
</svg>
