<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8477F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A399F5;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes think {
        0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-2px); }
      }
      .dot {
        animation: think 1.4s infinite ease-in-out both;
      }
      .dot-1 { animation-delay: -0.32s; }
      .dot-2 { animation-delay: -0.16s; }
    </style>
  </defs>
  <rect x="30" y="30" width="40" height="40" rx="14" fill="url(#bot-grad)" />
  <rect x="45" y="20" width="25" height="25" rx="10" fill="white" opacity="0.9" />
  <rect x="45" y="20" width="25" height="25" rx="10" fill="url(#bot-grad)" opacity="0.1" />
  <circle class="dot dot-1" cx="52.5" cy="32.5" r="2" fill="url(#bot-grad)" />
  <circle class="dot dot-2" cx="57.5" cy="32.5" r="2" fill="url(#bot-grad)" />
  <circle class="dot" cx="62.5" cy="32.5" r="2" fill="url(#bot-grad)" />
</svg>
